name: Feature request
description: Suggest an idea or an improvement
body:
  - type: markdown
    attributes:
      value: |
        Delos is prototype-first and controller-first. UI ideas are welcome as a description or a sketch; nothing needs to be polished.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find this one.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Stream video
        - Stream input/controller
        - Audio
        - Settings/UI
        - Library/artwork/metadata
        - Pairing/connection
        - Other
    validations:
      required: true
  - type: dropdown
    id: handheld
    attributes:
      label: Is this for handheld/controller use?
      options:
        - "Yes"
        - "No"
        - Both
    validations:
      required: true
