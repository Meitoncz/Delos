name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # AGP downloads the NDK version pinned in app/build.gradle automatically
        run: ./gradlew --no-daemon assembleNonRoot_gameDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: delos-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/nonRoot_game/debug/*arm64-v8a*.apk
            app/build/outputs/apk/nonRoot_game/debug/*x86_64*.apk
          retention-days: 14
